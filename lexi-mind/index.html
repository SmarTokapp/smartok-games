<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lexi Mind: Cyber Lexicon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="startScreen" class="screen">
    <h1 class="game-title">LEXI MIND</h1>
    <h2 class="game-subtitle">CYBER LEXICON</h2>
    <div class="category-grid">
      <button class="category-btn" data-category="anagrams">
        <span class="category-icon">🔤</span>
        <span class="category-name" data-key="anagrams">Anagrams</span>
      </button>
      <button class="category-btn" data-category="synonyms">
        <span class="category-icon">🔄</span>
        <span class="category-name" data-key="synonyms">Synonyms</span>
      </button>
      <button class="category-btn" data-category="definitions">
        <span class="category-icon">📖</span>
        <span class="category-name" data-key="definitions">Definitions</span>
      </button>
      <button class="category-btn" data-category="wordComplete">
        <span class="category-icon">✏️</span>
        <span class="category-name" data-key="wordComplete">Word Complete</span>
      </button>
    </div>
    <div class="high-score-display">
      <span data-key="highScore">High Score</span>: <span id="overallHighScore">0</span>
    </div>
    <button id="muteBtn" class="mute-btn">🔊</button>
    <p class="credits-text">Music: Backbay Lounge by Kevin MacLeod (Uppbeat)</p>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div class="game-header">
      <button id="exitBtn" class="exit-btn">←</button>
      <div class="lives-display">
        <span id="lives">❤️❤️❤️</span>
      </div>
      <div class="timer-display">
        <span id="timer">10</span>s
      </div>
    </div>
    <div class="streak-display">
      <span id="streak">🔥 0x</span>
    </div>
    <div class="question-container">
      <div id="questionText" class="question-text"></div>
      <div id="answerOptions" class="answer-options"></div>
    </div>
    <div class="score-display">
      <span data-key="score">Score</span>: <span id="currentScore">0</span>
    </div>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <h2 class="game-over-title" data-key="gameOver">Game Over</h2>
    <div class="star-rating">
      <span id="star1">⭐</span>
      <span id="star2">⭐</span>
      <span id="star3">⭐</span>
    </div>
    <div class="final-score">
      <span data-key="finalScore">Final Score</span>: <span id="finalScore">0</span>
    </div>
    <div class="accuracy-display">
      <span data-key="accuracy">Accuracy</span>: <span id="accuracy">0%</span>
    </div>
    <div class="category-high-score">
      <span data-key="categoryHighScore">Category High Score</span>: <span id="categoryHighScore">0</span>
    </div>
    <div class="game-over-buttons">
      <button id="replayBtn" class="game-over-btn" data-key="replayCategory">Replay Category</button>
      <button id="mainMenuBtn" class="game-over-btn" data-key="mainMenu">Main Menu</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
