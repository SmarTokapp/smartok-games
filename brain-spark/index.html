<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Spark: Quiz Blitz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <button id="audioToggleBtn" class="sound-toggle-btn">🔊</button>
            <div class="logo">
                <div class="brain-icon">⚡</div>
                <h1 class="game-title">Brain Spark</h1>
                <p class="game-subtitle">Quiz Blitz</p>
            </div>
            <div class="category-selection">
                <h2 class="section-title" data-i18n="chooseCategory">Choose Category</h2>
                <div class="category-grid">
                    <button class="category-btn" data-category="science">
                        <span class="category-icon">🔬</span>
                        <span class="category-name" data-i18n="science">Science</span>
                    </button>
                    <button class="category-btn" data-category="tech">
                        <span class="category-icon">💻</span>
                        <span class="category-name" data-i18n="tech">Tech</span>
                    </button>
                    <button class="category-btn" data-category="history">
                        <span class="category-icon">🌍</span>
                        <span class="category-name" data-i18n="history">World History</span>
                    </button>
                    <button class="category-btn" data-category="innovation">
                        <span class="category-icon">💡</span>
                        <span class="category-name" data-i18n="innovation">Innovation</span>
                    </button>
                </div>
            </div>
            <div class="high-score-display">
                <span class="high-score-label" data-i18n="highScore">High Score:</span>
                <span id="highScoreValue" class="high-score-value">0</span>
            </div>
            <p class="credits-text">Music: Backed Vibes by Kevin MacLeod (Uppbeat)</p>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <button id="audioToggleBtnGame" class="sound-toggle-btn">🔊</button>
            <div class="game-header">
                <button id="exitGameBtn" class="back-arrow-btn">←</button>
                <div class="score-display">
                    <span class="score-label" data-i18n="score">Score:</span>
                    <span id="scoreValue" class="score-value">0</span>
                </div>
                <div class="lives-display" id="livesContainer">
                    <!-- Lives will be injected here -->
                </div>
                <div class="streak-display">
                    <span class="streak-icon">🔥</span>
                    <span id="streakValue" class="streak-value">0</span>
                    <span class="streak-label" data-i18n="streak">streak</span>
                </div>
            </div>
            
            <div class="timer-container">
                <div class="timer-bar">
                    <div id="timerProgress" class="timer-progress"></div>
                </div>
                <span id="timerValue" class="timer-value">10</span>
            </div>

            <div class="question-container">
                <div class="category-badge" id="currentCategory">Science</div>
                <h2 id="questionText" class="question-text">Loading question...</h2>
            </div>

            <div class="answers-container" id="answersContainer">
                <!-- Answers will be injected here -->
            </div>

            <div class="feedback-overlay" id="feedbackOverlay">
                <div class="feedback-content">
                    <span id="feedbackIcon" class="feedback-icon"></span>
                    <span id="feedbackText" class="feedback-text"></span>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <div class="game-over-content">
                <div class="game-over-icon">🎮</div>
                <h2 class="game-over-title" data-i18n="gameOver">Game Over!</h2>
                <div class="star-rating" id="starRating">
                    <!-- Stars will be injected here -->
                </div>
                <div class="final-score">
                    <span class="final-score-label" data-i18n="finalScore">Final Score:</span>
                    <span id="finalScoreValue" class="final-score-value">0</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label" data-i18n="questions">Questions</span>
                        <span id="questionsAnswered" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" data-i18n="correct">Correct</span>
                        <span id="correctAnswers" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" data-i18n="bestStreak">Best Streak</span>
                        <span id="bestStreak" class="stat-value">0</span>
                    </div>
                </div>
                <div class="new-high-score" id="newHighScore" style="display: none;">
                    <span class="trophy-icon">🏆</span>
                    <span class="new-high-score-text" data-i18n="newHighScore">New High Score!</span>
                </div>
                <button id="replayCategoryBtn" class="play-again-btn" data-i18n="replayCategory">Replay Category</button>
                <button id="mainMenuBtn" class="home-btn" data-i18n="mainMenu">Main Menu</button>
            </div>
        </div>
    </div>

    <script src="../i18n-loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
