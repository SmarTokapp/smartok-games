<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Echo Nexus - Sequence Memory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      padding-top: max(15px, env(safe-area-inset-top));
      background: rgba(139, 0, 139, 0.2);
      border: 2px solid #8b008b;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(139, 0, 139, 0.5);
    }

    .back-btn {
      background: linear-gradient(135deg, #ff00ff, #8b008b);
      border: none;
      color: #fff;
      font-size: 24px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .back-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .hearts {
      display: flex;
      gap: 5px;
      font-size: 24px;
    }

    .heart {
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066;
    }

    .heart.lost {
      color: #333;
      text-shadow: none;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    .audio-btn {
      background: linear-gradient(135deg, #00ffff, #0088ff);
      border: none;
      color: #000;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .audio-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
    }

    .status {
      font-size: 16px;
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    /* Game Area */
    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 350px;
      width: 100%;
    }

    .node {
      aspect-ratio: 1;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      border: 4px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .node:active {
      transform: scale(0.95);
    }

    .node.disabled {
      pointer-events: none;
      opacity: 0.7;
    }

    .node-cyan {
      background: linear-gradient(135deg, #00ffff, #0088ff);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      border-color: #00ffff;
    }

    .node-cyan.active {
      background: linear-gradient(135deg, #00ffff, #ffffff);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.9);
      transform: scale(1.05);
    }

    .node-pink {
      background: linear-gradient(135deg, #ff00ff, #ff0088);
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
      border-color: #ff00ff;
    }

    .node-pink.active {
      background: linear-gradient(135deg, #ff00ff, #ffffff);
      box-shadow: 0 0 50px rgba(255, 0, 255, 0.9);
      transform: scale(1.05);
    }

    .node-yellow {
      background: linear-gradient(135deg, #ffff00, #ff8800);
      box-shadow: 0 0 30px rgba(255, 255, 0, 0.5);
      border-color: #ffff00;
    }

    .node-yellow.active {
      background: linear-gradient(135deg, #ffff00, #ffffff);
      box-shadow: 0 0 50px rgba(255, 255, 0, 0.9);
      transform: scale(1.05);
    }

    .node-green {
      background: linear-gradient(135deg, #00ff00, #00ff88);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
      border-color: #00ff00;
    }

    .node-green.active {
      background: linear-gradient(135deg, #00ff00, #ffffff);
      box-shadow: 0 0 50px rgba(0, 255, 0, 0.9);
      transform: scale(1.05);
    }

    /* Start Screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-title {
      font-size: 36px;
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 0 0 20px #ff00ff;
      margin-bottom: 20px;
    }

    .game-subtitle {
      font-size: 18px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 40px;
    }

    .start-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #ff00ff;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff00ff, #8b008b);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
      margin-bottom: 30px;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
    }

    .attribution {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      max-width: 300px;
    }

    .attribution a {
      color: #00ffff;
      text-decoration: none;
    }

    /* Game Over Screen */
    .game-over-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-over-title {
      font-size: 42px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 30px #ff0000;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 28px;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
      margin-bottom: 40px;
    }

    .play-again-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #00ffff;
      border-radius: 30px;
      background: linear-gradient(135deg, #00ffff, #0088ff);
      color: #000;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
    }

    .play-again-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
    }

    .hidden {
      display: none !important;
    }

    /* Error Flash */
    .error-flash {
      animation: flashRed 0.5s;
    }

    @keyframes flashRed {
      0%, 100% { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%); }
      50% { background: rgba(255, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <h1 class="game-title" data-i18n="gameTitle">ECHO NEXUS</h1>
      <p class="game-subtitle" data-i18n="gameSubtitle">Watch the sequence, then repeat it!</p>
      <button class="start-btn" onclick="startGame()" data-i18n="startGame">START GAME</button>
      <div class="attribution">
        "Bumba Crossing" Kevin MacLeod (incompetech.com)<br>
        Licensed under Creative Commons: By Attribution 4.0 License<br>
        <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank">http://creativecommons.org/licenses/by/4.0/</a>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
      <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="stats">
          <div class="hearts" id="hearts">
            <span class="heart">❤</span>
            <span class="heart">❤</span>
            <span class="heart">❤</span>
          </div>
          <div class="score" id="score">0</div>
          <div class="status" id="status" data-i18n="watch">Watch...</div>
        </div>
        <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🔊</button>
      </div>

      <div class="game-area">
        <div class="nodes-grid">
          <div class="node node-cyan" id="node0" onclick="handleNodeClick(0)"></div>
          <div class="node node-pink" id="node1" onclick="handleNodeClick(1)"></div>
          <div class="node node-yellow" id="node2" onclick="handleNodeClick(2)"></div>
          <div class="node node-green" id="node3" onclick="handleNodeClick(3)"></div>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="game-over-screen">
      <h1 class="game-over-title" data-i18n="gameOver">GAME OVER</h1>
      <p class="final-score" data-i18n="finalScore">Final Score: <span id="finalScore">0</span></p>
      <button class="play-again-btn" onclick="startGame()" data-i18n="playAgain">PLAY AGAIN</button>
    </div>
  </div>

  <script src="../i18n-loader.js"></script>
  <script>
    // Game State
    let sequence = [];
    let playerIndex = 0;
    let lives = 3;
    let score = 0;
    let isPlayerTurn = false;
    let isPlayingSequence = false;
    let isMuted = false;

    // Use universal i18n loader
    function t(key) {
        return gameI18n.t(key);
    }

    // Audio Context
    let audioContext = null;

    // Node frequencies (in Hz)
    const nodeFrequencies = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

    // Background Music
    let bgMusic = null;
    let musicEnabled = false;

    function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      isMuted = !isMuted;
      const audioBtn = document.getElementById('audioBtn');
      audioBtn.textContent = isMuted ? '🔇' : '🔊';
      
      if (bgMusic) {
        if (isMuted) {
          bgMusic.pause();
        } else if (musicEnabled) {
          bgMusic.play();
        }
      }
    }

    function playNodeTone(nodeIndex) {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = nodeFrequencies[nodeIndex];
      oscillator.type = 'sine';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playSuccessSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 880;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.2;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
      oscillator.stop(audioContext.currentTime + 0.2);
    }

    function playErrorSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 150;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
      oscillator.stop(audioContext.currentTime + 0.4);
    }

    function playGameOverSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 100;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
      oscillator.stop(audioContext.currentTime + 0.6);
    }

    function playBackgroundMusic() {
      if (musicEnabled) return;
      bgMusic = new Audio('bgm.mp3');
      bgMusic.loop = true;
      bgMusic.volume = 0.3;
      bgMusic.play().catch(e => console.log('Audio play failed:', e));
      musicEnabled = true;
    }

    function stopBackgroundMusic() {
      if (bgMusic) {
        bgMusic.pause();
        bgMusic.currentTime = 0;
        musicEnabled = false;
      }
    }

    function flashNode(nodeIndex) {
      const node = document.getElementById(`node${nodeIndex}`);
      node.classList.add('active');
      playNodeTone(nodeIndex);
      
      setTimeout(() => {
        node.classList.remove('active');
      }, 300);
    }

    function disableNodes() {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`node${i}`).classList.add('disabled');
      }
    }

    function enableNodes() {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`node${i}`).classList.remove('disabled');
      }
    }

    function playSequence() {
      isPlayingSequence = true;
      isPlayerTurn = false;
      disableNodes();
      document.getElementById('status').textContent = t('watch');
      
      let index = 0;
      const interval = setInterval(() => {
        if (index < sequence.length) {
          flashNode(sequence[index]);
          index++;
        } else {
          clearInterval(interval);
          isPlayingSequence = false;
          isPlayerTurn = true;
          enableNodes();
          document.getElementById('status').textContent = t('yourTurn');
        }
      }, 600);
    }

    function addToSequence() {
      const randomNode = Math.floor(Math.random() * 4);
      sequence.push(randomNode);
    }

    function handleNodeClick(nodeIndex) {
      if (!isPlayerTurn || isPlayingSequence) return;
      
      flashNode(nodeIndex);
      
      if (nodeIndex === sequence[playerIndex]) {
        playerIndex++;
        
        if (playerIndex === sequence.length) {
          // Correct sequence completed
          playSuccessSound();
          score += 10;
          document.getElementById('score').textContent = score;
          playerIndex = 0;
          isPlayerTurn = false;
          
          setTimeout(() => {
            addToSequence();
            playSequence();
          }, 500);
        }
      } else {
        // Wrong node
        playErrorSound();
        loseLife();
        
        // Flash screen red
        document.body.classList.add('error-flash');
        setTimeout(() => {
          document.body.classList.remove('error-flash');
        }, 500);
        
        if (lives > 0) {
          // Replay the same sequence
          playerIndex = 0;
          isPlayerTurn = false;
          setTimeout(() => {
            playSequence();
          }, 1000);
        }
      }
    }

    function loseLife() {
      lives--;
      updateHearts();
      
      if (lives <= 0) {
        gameOver();
      }
    }

    function updateHearts() {
      const heartsContainer = document.getElementById('hearts');
      const hearts = heartsContainer.querySelectorAll('.heart');
      
      hearts.forEach((heart, index) => {
        if (index >= lives) {
          heart.classList.add('lost');
        } else {
          heart.classList.remove('lost');
        }
      });
    }

    function gameOver() {
      isPlayerTurn = false;
      isPlayingSequence = false;
      stopBackgroundMusic();
      playGameOverSound();
      
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').textContent = score;
    }

    function startGame() {
      // Reset state
      sequence = [];
      playerIndex = 0;
      lives = 3;
      score = 0;
      isPlayerTurn = false;
      isPlayingSequence = false;
      
      // Update UI
      document.getElementById('score').textContent = score;
      updateHearts();
      
      // Show game screen
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('gameScreen').classList.remove('hidden');
      
      // Start music
      playBackgroundMusic();
      
      // Start first round
      addToSequence();
      setTimeout(() => {
        playSequence();
      }, 500);
    }

    function goBack() {
      isPlayerTurn = false;
      isPlayingSequence = false;
      stopBackgroundMusic();
      
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    // Initialize on load
    async function init() {
      await gameI18n.init('echo-nexus');
      
      // Pre-initialize audio context on first user interaction
      document.body.addEventListener('click', () => {
        if (!audioContext) initAudio();
      }, { once: true });
    }
    
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
