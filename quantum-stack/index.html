<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quantum Stack - Block Stacking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 30%, #2c3e50 100%);
      height: 100vh;
      width: 100vw;
      color: #2c3e50;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      padding-top: max(15px, env(safe-area-inset-top));
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #2c3e50;
      border-radius: 0;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0px #2c3e50;
    }

    .back-btn {
      background: #ff6b6b;
      border: 3px solid #2c3e50;
      color: #2c3e50;
      font-size: 20px;
      font-weight: bold;
      width: 45px;
      height: 45px;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0px #2c3e50;
      transition: transform 0.1s, box-shadow 0.1s;
      pointer-events: auto;
    }

    .back-btn:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px #2c3e50;
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .hearts {
      display: flex;
      gap: 5px;
      font-size: 24px;
    }

    .heart {
      color: #ff6b6b;
    }

    .heart.lost {
      color: #ccc;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }

    .audio-btn {
      background: #4ecdc4;
      border: 3px solid #2c3e50;
      color: #2c3e50;
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0px #2c3e50;
      transition: transform 0.1s, box-shadow 0.1s;
      pointer-events: auto;
    }

    .audio-btn:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px #2c3e50;
    }

    /* Game Area */
    .game-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Start Screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-title {
      font-size: 36px;
      font-weight: bold;
      color: #2c3e50;
      text-shadow: 3px 3px 0px #ff6b6b;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .game-subtitle {
      font-size: 18px;
      color: #2c3e50;
      margin-bottom: 40px;
    }

    .start-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 4px solid #2c3e50;
      border-radius: 0;
      background: #4ecdc4;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 4px 4px 0px #2c3e50;
      margin-bottom: 30px;
    }

    .start-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #2c3e50;
    }

    .attribution {
      font-size: 12px;
      color: #2c3e50;
      text-align: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.8);
      border: 3px solid #2c3e50;
      max-width: 300px;
    }

    .attribution a {
      color: #4ecdc4;
      text-decoration: none;
    }

    /* Game Over Screen */
    .game-over-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-over-title {
      font-size: 42px;
      font-weight: bold;
      color: #ff6b6b;
      text-shadow: 3px 3px 0px #2c3e50;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .final-score {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 40px;
    }

    .play-again-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 4px solid #2c3e50;
      border-radius: 0;
      background: #4ecdc4;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 4px 4px 0px #2c3e50;
    }

    .play-again-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #2c3e50;
    }

    .hidden {
      display: none !important;
    }

    /* Error Flash */
    .error-flash {
      animation: flashRed 0.3s;
    }

    @keyframes flashRed {
      0%, 100% { background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 30%, #2c3e50 100%); }
      50% { background: rgba(255, 107, 107, 0.5); }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <h1 class="game-title">QUANTUM STACK</h1>
      <p class="game-subtitle">Stack the blocks perfectly to build your tower!</p>
      <button class="start-btn" onclick="startGame()">START GAME</button>
      <div class="attribution">
        "On the Ground" Kevin MacLeod (incompetech.com)<br>
        Licensed under Creative Commons: By Attribution 4.0 License<br>
        <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank">http://creativecommons.org/licenses/by/4.0/</a>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
      <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="stats">
          <div class="hearts" id="hearts">
            <span class="heart">❤</span>
            <span class="heart">❤</span>
            <span class="heart">❤</span>
          </div>
          <div class="score" id="score">0</div>
        </div>
        <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🔊</button>
      </div>

      <div class="game-area" id="gameArea">
        <canvas id="gameCanvas"></canvas>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="game-over-screen">
      <h1 class="game-over-title">GAME OVER</h1>
      <p class="final-score">Final Score: <span id="finalScore">0</span></p>
      <p class="final-score">Best: <span id="highScore">0</span></p>
      <button class="play-again-btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // Game State
    let lives = 3;
    let score = 0;
    let blocks = [];
    let currentBlock = null;
    let isGameRunning = false;
    let isMuted = false;
    let blockSpeed = 1.5;
    let direction = 1;

    // Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('gameArea');

    // Block dimensions
    const BLOCK_HEIGHT = 60;
    const INITIAL_BLOCK_WIDTH = 200;
    let currentBlockWidth = INITIAL_BLOCK_WIDTH;

    // Audio Context
    let audioContext = null;

    // Background Music
    let bgMusic = null;
    let musicEnabled = false;

    function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      isMuted = !isMuted;
      const audioBtn = document.getElementById('audioBtn');
      audioBtn.textContent = isMuted ? '🔇' : '🔊';
      
      if (bgMusic) {
        if (isMuted) {
          bgMusic.pause();
        } else if (musicEnabled) {
          bgMusic.play();
        }
      }
    }

    function playDropSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 400;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.15;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function playPerfectSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 880;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.2;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playHitSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 600;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.15;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      oscillator.stop(audioContext.currentTime + 0.15);
    }

    function playErrorSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 150;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
      oscillator.stop(audioContext.currentTime + 0.4);
    }

    function playGameOverSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 100;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
      oscillator.stop(audioContext.currentTime + 0.5);
    }

    function playBackgroundMusic() {
      if (musicEnabled) return;
      bgMusic = new Audio('bgm.mp3');
      bgMusic.loop = true;
      bgMusic.volume = 0.3;
      bgMusic.play().catch(e => console.log('Audio play failed:', e));
      musicEnabled = true;
    }

    function stopBackgroundMusic() {
      if (bgMusic) {
        bgMusic.pause();
        bgMusic = null;
        musicEnabled = false;
      }
    }

    function resizeCanvas() {
      const rect = gameArea.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      console.log('Canvas resized to:', canvas.width, canvas.height, 'Game area rect:', rect);
    }

    function createBlock(x, y, width, color) {
      return { x, y, width, color };
    }

    function spawnBlock() {
      const canvasWidth = canvas.width;
      const canvasHeight = canvas.height;
      
      // Retro color palette
      const retroColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#f38181', '#aa96da', '#fcbad3'];
      
      if (blocks.length === 0) {
        // Base block - place at bottom of screen
        const baseY = canvasHeight - 100;
        const baseBlock = createBlock(
          (canvasWidth - INITIAL_BLOCK_WIDTH) / 2,
          baseY,
          INITIAL_BLOCK_WIDTH,
          retroColors[0]
        );
        blocks.push(baseBlock);
        currentBlockWidth = INITIAL_BLOCK_WIDTH;
        
        // Spawn first moving block above the base block
        const colorIndex = blocks.length % retroColors.length;
        currentBlock = createBlock(
          0,
          baseY - BLOCK_HEIGHT,
          currentBlockWidth,
          retroColors[colorIndex]
        );
      } else {
        // Spawn new block above the top block of the tower
        const topBlock = blocks[blocks.length - 1];
        const colorIndex = blocks.length % retroColors.length;
        currentBlock = createBlock(
          0,
          topBlock.y - BLOCK_HEIGHT,
          currentBlockWidth,
          retroColors[colorIndex]
        );
      }
      
      // Reset direction
      direction = 1;
      
      console.log('Spawned block:', currentBlock, 'Canvas size:', canvasWidth, canvasHeight);
    }

    function updateBlock() {
      if (!currentBlock || !isGameRunning) return;
      
      currentBlock.x += blockSpeed * direction;
      
      // Bounce off edges
      if (currentBlock.x <= 0) {
        currentBlock.x = 0;
        direction = 1;
      } else if (currentBlock.x + currentBlock.width >= canvas.width) {
        currentBlock.x = canvas.width - currentBlock.width;
        direction = -1;
      }
    }

    function dropBlock() {
      if (!currentBlock || !isGameRunning) return;
      
      playDropSound();
      
      const previousBlock = blocks[blocks.length - 1];
      
      // Calculate overlap
      const overlapLeft = Math.max(currentBlock.x, previousBlock.x);
      const overlapRight = Math.min(currentBlock.x + currentBlock.width, previousBlock.x + previousBlock.width);
      const overlapWidth = overlapRight - overlapLeft;
      
      if (overlapWidth <= 0) {
        // Complete miss
        playErrorSound();
        loseLife();
        
        // Remove current block
        currentBlock = null;
        
        if (lives > 0) {
          // Spawn new block with same width above the top block
          setTimeout(() => {
            const topBlock = blocks[blocks.length - 1];
            const retroColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#f38181', '#aa96da', '#fcbad3'];
            const colorIndex = blocks.length % retroColors.length;
            currentBlock = createBlock(
              0,
              topBlock.y - BLOCK_HEIGHT,
              currentBlockWidth,
              retroColors[colorIndex]
            );
            direction = 1;
          }, 500);
        }
        return;
      }
      
      // Calculate perfect alignment (within 5 pixels)
      const isPerfect = Math.abs(currentBlock.x - previousBlock.x) < 5;
      
      if (isPerfect) {
        // Perfect alignment
        playPerfectSound();
        score += 20;
        currentBlock.x = previousBlock.x; // Snap to perfect position
        currentBlock.width = previousBlock.width;
      } else {
        // Partial overlap - slice the block
        playHitSound();
        score += 10;
        currentBlock.x = overlapLeft;
        currentBlock.width = overlapWidth;
        currentBlockWidth = overlapWidth; // Update for next blocks
      }
      
      // The moving block is already at the correct y position (above the top block)
      // Just keep it there after slicing
      
      // Add block to stack
      blocks.push(currentBlock);
      currentBlock = null;
      
      // Update score display
      document.getElementById('score').textContent = score;
      
      // Increase difficulty
      blockSpeed = 1.5 + Math.floor(score / 50) * 0.3;
      
      // Shift all blocks down if tower is too high (above 40% of screen)
      if (previousBlock.y < canvas.height * 0.4) {
        for (let i = 0; i < blocks.length; i++) {
          blocks[i].y += BLOCK_HEIGHT;
        }
      }
      
      // Spawn next block
      setTimeout(() => {
        if (isGameRunning) {
          spawnBlock();
        }
      }, 300);
    }

    function loseLife() {
      lives--;
      updateHearts();
      
      if (lives <= 0) {
        gameOver();
      } else {
        // Flash screen red
        document.body.classList.add('error-flash');
        setTimeout(() => document.body.classList.remove('error-flash'), 300);
      }
    }

    function updateHearts() {
      const heartsContainer = document.getElementById('hearts');
      const hearts = heartsContainer.querySelectorAll('.heart');
      
      hearts.forEach((heart, index) => {
        if (index >= lives) {
          heart.classList.add('lost');
        } else {
          heart.classList.remove('lost');
        }
      });
    }

    function gameOver() {
      isGameRunning = false;
      stopBackgroundMusic();
      playGameOverSound();
      
      // Handle high score
      const highScore = localStorage.getItem('quantum_stack_high_score') || 0;
      if (score > highScore) {
        localStorage.setItem('quantum_stack_high_score', score);
      }
      
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('highScore').textContent = Math.max(score, highScore);
    }

    function draw() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      console.log('Drawing - Canvas size:', canvas.width, canvas.height, 'Blocks:', blocks.length, 'Current block:', currentBlock);
      
      // Draw retro pixel grid
      ctx.strokeStyle = 'rgba(44, 62, 80, 0.2)';
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.width; i += 32) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 32) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
      
      // Draw stacked blocks
      blocks.forEach((block, index) => {
        drawBlock(block, index === blocks.length - 1);
      });
      
      // Draw current moving block
      if (currentBlock) {
        drawBlock(currentBlock, true);
      }
    }

    function drawBlock(block, isTop) {
      // Main block
      ctx.fillStyle = block.color;
      ctx.fillRect(block.x, block.y, block.width, BLOCK_HEIGHT);
      
      // Retro pixel border
      ctx.strokeStyle = '#2c3e50';
      ctx.lineWidth = 3;
      ctx.strokeRect(block.x, block.y, block.width, BLOCK_HEIGHT);
      
      // Retro highlight - top face
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillRect(block.x + 2, block.y + 2, block.width - 4, 4);
      
      // Retro shadow - right face
      ctx.fillStyle = 'rgba(44, 62, 80, 0.3)';
      ctx.fillRect(block.x + block.width - 4, block.y + 2, 4, BLOCK_HEIGHT - 4);
      
      // Retro shadow - bottom face
      ctx.fillStyle = 'rgba(44, 62, 80, 0.3)';
      ctx.fillRect(block.x + 2, block.y + BLOCK_HEIGHT - 4, block.width - 4, 4);
      
      // Glow effect for top block (retro style)
      if (isTop) {
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 4;
        ctx.strokeRect(block.x - 2, block.y - 2, block.width + 4, BLOCK_HEIGHT + 4);
      }
    }

    function gameLoop() {
      if (!isGameRunning) return;
      
      updateBlock();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      // Reset state
      lives = 3;
      score = 0;
      blocks = [];
      currentBlock = null;
      blockSpeed = 1.5;
      isGameRunning = true;
      
      // Update UI
      document.getElementById('score').textContent = score;
      updateHearts();
      
      // Show game screen
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('gameScreen').classList.remove('hidden');
      
      // Resize canvas after layout update
      requestAnimationFrame(() => {
        resizeCanvas();
        
        // Start game
        spawnBlock();
        playBackgroundMusic();
        gameLoop();
      });
    }

    function goBack() {
      isGameRunning = false;
      stopBackgroundMusic();
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    // Event Listeners
    window.addEventListener('resize', resizeCanvas);
    
    // Add global block drop event listener to window for full-screen touch
    window.addEventListener('pointerdown', (e) => {
      // Ignore clicks on buttons in top bar
      if (e.target.closest('.top-bar')) return;
      // Only drop if game is running
      if (isGameRunning) {
        dropBlock();
      }
    });
    
    // Initial canvas setup
    resizeCanvas();
  </script>
</body>
</html>
