<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quantum Stack - Block Stacking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      padding-top: max(15px, env(safe-area-inset-top));
      background: rgba(139, 0, 139, 0.2);
      border: 2px solid #8b008b;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(139, 0, 139, 0.5);
    }

    .back-btn {
      background: linear-gradient(135deg, #ff00ff, #8b008b);
      border: none;
      color: #fff;
      font-size: 24px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .back-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .hearts {
      display: flex;
      gap: 5px;
      font-size: 24px;
    }

    .heart {
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066;
    }

    .heart.lost {
      color: #333;
      text-shadow: none;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    .audio-btn {
      background: linear-gradient(135deg, #00ffff, #0088ff);
      border: none;
      color: #000;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .audio-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
    }

    /* Game Area */
    .game-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Start Screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-title {
      font-size: 36px;
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 0 0 20px #ff00ff;
      margin-bottom: 20px;
    }

    .game-subtitle {
      font-size: 18px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 40px;
    }

    .start-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #ff00ff;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff00ff, #8b008b);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
      margin-bottom: 30px;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
    }

    .attribution {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      max-width: 300px;
    }

    .attribution a {
      color: #00ffff;
      text-decoration: none;
    }

    /* Game Over Screen */
    .game-over-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-over-title {
      font-size: 42px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 30px #ff0000;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 28px;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
      margin-bottom: 40px;
    }

    .play-again-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #00ffff;
      border-radius: 30px;
      background: linear-gradient(135deg, #00ffff, #0088ff);
      color: #000;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
    }

    .play-again-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
    }

    .hidden {
      display: none !important;
    }

    /* Error Flash */
    .error-flash {
      animation: flashRed 0.3s;
    }

    @keyframes flashRed {
      0%, 100% { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%); }
      50% { background: rgba(255, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <h1 class="game-title">QUANTUM STACK</h1>
      <p class="game-subtitle">Stack the blocks perfectly to build your tower!</p>
      <button class="start-btn" onclick="startGame()">START GAME</button>
      <div class="attribution">
        "On the Ground" Kevin MacLeod (incompetech.com)<br>
        Licensed under Creative Commons: By Attribution 4.0 License<br>
        <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank">http://creativecommons.org/licenses/by/4.0/</a>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
      <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="stats">
          <div class="hearts" id="hearts">
            <span class="heart">❤</span>
            <span class="heart">❤</span>
            <span class="heart">❤</span>
          </div>
          <div class="score" id="score">0</div>
        </div>
        <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🔊</button>
      </div>

      <div class="game-area" id="gameArea">
        <canvas id="gameCanvas"></canvas>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="game-over-screen">
      <h1 class="game-over-title">GAME OVER</h1>
      <p class="final-score">Final Score: <span id="finalScore">0</span></p>
      <p class="final-score">Best: <span id="highScore">0</span></p>
      <button class="play-again-btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // Game State
    let lives = 3;
    let score = 0;
    let blocks = [];
    let currentBlock = null;
    let isGameRunning = false;
    let isMuted = false;
    let cameraY = 0;
    let blockSpeed = 3;
    let direction = 1;

    // Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('gameArea');

    // Block dimensions
    const BLOCK_HEIGHT = 30;
    const INITIAL_BLOCK_WIDTH = 200;
    let currentBlockWidth = INITIAL_BLOCK_WIDTH;

    // Audio Context
    let audioContext = null;

    // Background Music
    let bgMusic = null;
    let musicEnabled = false;

    function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      isMuted = !isMuted;
      const audioBtn = document.getElementById('audioBtn');
      audioBtn.textContent = isMuted ? '🔇' : '🔊';
      
      if (bgMusic) {
        if (isMuted) {
          bgMusic.pause();
        } else if (musicEnabled) {
          bgMusic.play();
        }
      }
    }

    function playDropSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 400;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.15;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function playPerfectSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 880;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.2;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playHitSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 600;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.15;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      oscillator.stop(audioContext.currentTime + 0.15);
    }

    function playErrorSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 150;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
      oscillator.stop(audioContext.currentTime + 0.4);
    }

    function playGameOverSound() {
      if (!audioContext) initAudio();
      if (isMuted) return;
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 100;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
      oscillator.stop(audioContext.currentTime + 0.5);
    }

    function playBackgroundMusic() {
      if (musicEnabled) return;
      bgMusic = new Audio('bgm.mp3');
      bgMusic.loop = true;
      bgMusic.volume = 0.3;
      bgMusic.play().catch(e => console.log('Audio play failed:', e));
      musicEnabled = true;
    }

    function stopBackgroundMusic() {
      if (bgMusic) {
        bgMusic.pause();
        bgMusic = null;
        musicEnabled = false;
      }
    }

    function resizeCanvas() {
      const rect = gameArea.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    function createBlock(x, y, width, color) {
      return { x, y, width, color };
    }

    function spawnBlock() {
      const canvasWidth = canvas.width;
      const canvasHeight = canvas.height;
      const baseY = canvasHeight - 50;
      
      if (blocks.length === 0) {
        // Base block
        const baseBlock = createBlock(
          (canvasWidth - INITIAL_BLOCK_WIDTH) / 2,
          baseY,
          INITIAL_BLOCK_WIDTH,
          '#ff00ff'
        );
        blocks.push(baseBlock);
        currentBlockWidth = INITIAL_BLOCK_WIDTH;
      }
      
      // Spawn new block at top
      const spawnY = baseY - (blocks.length * BLOCK_HEIGHT) - BLOCK_HEIGHT;
      currentBlock = createBlock(
        0,
        spawnY,
        currentBlockWidth,
        `hsl(${(blocks.length * 30) % 360}, 100%, 50%)`
      );
      
      // Reset direction
      direction = 1;
    }

    function updateBlock() {
      if (!currentBlock || !isGameRunning) return;
      
      currentBlock.x += blockSpeed * direction;
      
      // Bounce off edges
      if (currentBlock.x <= 0) {
        currentBlock.x = 0;
        direction = 1;
      } else if (currentBlock.x + currentBlock.width >= canvas.width) {
        currentBlock.x = canvas.width - currentBlock.width;
        direction = -1;
      }
    }

    function dropBlock() {
      if (!currentBlock || !isGameRunning) return;
      
      playDropSound();
      
      const previousBlock = blocks[blocks.length - 1];
      
      // Calculate overlap
      const overlapLeft = Math.max(currentBlock.x, previousBlock.x);
      const overlapRight = Math.min(currentBlock.x + currentBlock.width, previousBlock.x + previousBlock.width);
      const overlapWidth = overlapRight - overlapLeft;
      
      if (overlapWidth <= 0) {
        // Complete miss
        playErrorSound();
        loseLife();
        
        // Remove current block
        currentBlock = null;
        
        if (lives > 0) {
          // Spawn new block with same width
          setTimeout(() => {
            const canvasHeight = canvas.height;
            const baseY = canvasHeight - 50;
            const spawnY = baseY - (blocks.length * BLOCK_HEIGHT) - BLOCK_HEIGHT;
            currentBlock = createBlock(
              0,
              spawnY,
              currentBlockWidth,
              `hsl(${(blocks.length * 30) % 360}, 100%, 50%)`
            );
            direction = 1;
          }, 500);
        }
        return;
      }
      
      // Calculate perfect alignment (within 5 pixels)
      const isPerfect = Math.abs(currentBlock.x - previousBlock.x) < 5;
      
      if (isPerfect) {
        // Perfect alignment
        playPerfectSound();
        score += 20;
        currentBlock.x = previousBlock.x; // Snap to perfect position
        currentBlock.width = previousBlock.width;
      } else {
        // Partial overlap - slice the block
        playHitSound();
        score += 10;
        currentBlock.x = overlapLeft;
        currentBlock.width = overlapWidth;
        currentBlockWidth = overlapWidth; // Update for next blocks
      }
      
      // Add block to stack
      blocks.push(currentBlock);
      currentBlock = null;
      
      // Update score display
      document.getElementById('score').textContent = score;
      
      // Increase difficulty
      blockSpeed = 3 + Math.floor(score / 50) * 0.5;
      
      // Move camera down if stack is high
      if (blocks.length > 5) {
        cameraY = (blocks.length - 5) * BLOCK_HEIGHT;
      }
      
      // Spawn next block
      setTimeout(() => {
        if (isGameRunning) {
          spawnBlock();
        }
      }, 300);
    }

    function loseLife() {
      lives--;
      updateHearts();
      
      if (lives <= 0) {
        gameOver();
      } else {
        // Flash screen red
        document.body.classList.add('error-flash');
        setTimeout(() => document.body.classList.remove('error-flash'), 300);
      }
    }

    function updateHearts() {
      const heartsContainer = document.getElementById('hearts');
      const hearts = heartsContainer.querySelectorAll('.heart');
      
      hearts.forEach((heart, index) => {
        if (index >= lives) {
          heart.classList.add('lost');
        } else {
          heart.classList.remove('lost');
        }
      });
    }

    function gameOver() {
      isGameRunning = false;
      stopBackgroundMusic();
      playGameOverSound();
      
      // Handle high score
      const highScore = localStorage.getItem('quantum_stack_high_score') || 0;
      if (score > highScore) {
        localStorage.setItem('quantum_stack_high_score', score);
      }
      
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('highScore').textContent = Math.max(score, highScore);
    }

    function draw() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw background grid
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
      
      // Apply camera offset
      ctx.save();
      ctx.translate(0, cameraY);
      
      // Draw stacked blocks
      blocks.forEach((block, index) => {
        drawBlock(block, index === blocks.length - 1);
      });
      
      // Draw current moving block
      if (currentBlock) {
        drawBlock(currentBlock, true);
      }
      
      ctx.restore();
    }

    function drawBlock(block, isTop) {
      // Main block
      ctx.fillStyle = block.color;
      ctx.fillRect(block.x, block.y, block.width, BLOCK_HEIGHT);
      
      // 3D effect - top face
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fillRect(block.x, block.y, block.width, 5);
      
      // 3D effect - right face
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(block.x + block.width - 5, block.y, 5, BLOCK_HEIGHT);
      
      // Glow effect for top block
      if (isTop) {
        ctx.shadowColor = block.color;
        ctx.shadowBlur = 20;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(block.x, block.y, block.width, BLOCK_HEIGHT);
        ctx.shadowBlur = 0;
      }
    }

    function gameLoop() {
      if (!isGameRunning) return;
      
      updateBlock();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      // Reset state
      lives = 3;
      score = 0;
      blocks = [];
      currentBlock = null;
      cameraY = 0;
      blockSpeed = 3;
      isGameRunning = true;
      
      // Update UI
      document.getElementById('score').textContent = score;
      updateHearts();
      
      // Show game screen
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('gameScreen').classList.remove('hidden');
      
      // Resize canvas
      resizeCanvas();
      
      // Start game
      spawnBlock();
      playBackgroundMusic();
      gameLoop();
    }

    function goBack() {
      isGameRunning = false;
      stopBackgroundMusic();
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    // Event Listeners
    window.addEventListener('resize', resizeCanvas);
    
    gameArea.addEventListener('click', dropBlock);
    gameArea.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dropBlock();
    });

    // Initial canvas setup
    resizeCanvas();
  </script>
</body>
</html>
