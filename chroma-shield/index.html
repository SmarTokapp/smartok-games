<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chroma Shield - Color Reflex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      padding-top: max(15px, env(safe-area-inset-top));
      background: rgba(139, 0, 139, 0.2);
      border: 2px solid #8b008b;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(139, 0, 139, 0.5);
    }

    .back-btn {
      background: linear-gradient(135deg, #ff00ff, #8b008b);
      border: none;
      color: #fff;
      font-size: 24px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .back-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .hearts {
      display: flex;
      gap: 5px;
      font-size: 24px;
    }

    .heart {
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066;
    }

    .heart.lost {
      color: #333;
      text-shadow: none;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }

    /* Game Area */
    .game-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .shield {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      transition: all 0.2s;
      position: relative;
      z-index: 10;
    }

    .shield-cyan {
      background: radial-gradient(circle, #00ffff 0%, #0088ff 100%);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.3);
      border: 4px solid #00ffff;
    }

    .shield-magenta {
      background: radial-gradient(circle, #ff00ff 0%, #ff0088 100%);
      box-shadow: 0 0 50px rgba(255, 0, 255, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.3);
      border: 4px solid #ff00ff;
    }

    .shield.pulse {
      animation: pulse 0.3s;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .projectile {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      z-index: 5;
    }

    .projectile-cyan {
      background: radial-gradient(circle, #00ffff 0%, #0088ff 100%);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }

    .projectile-magenta {
      background: radial-gradient(circle, #ff00ff 0%, #ff0088 100%);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
    }

    /* Start Screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-title {
      font-size: 36px;
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 0 0 20px #ff00ff;
      margin-bottom: 20px;
    }

    .game-subtitle {
      font-size: 18px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 40px;
    }

    .start-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #ff00ff;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff00ff, #8b008b);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
      margin-bottom: 30px;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
    }

    .attribution {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      max-width: 300px;
    }

    .attribution a {
      color: #00ffff;
      text-decoration: none;
    }

    /* Game Over Screen */
    .game-over-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    .game-over-title {
      font-size: 42px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 30px #ff0000;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 28px;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
      margin-bottom: 40px;
    }

    .play-again-btn {
      padding: 15px 50px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #00ffff;
      border-radius: 30px;
      background: linear-gradient(135deg, #00ffff, #0088ff);
      color: #000;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
    }

    .play-again-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
    }

    .hidden {
      display: none !important;
    }

    /* Error Flash */
    .error-flash {
      animation: flashRed 0.3s;
    }

    @keyframes flashRed {
      0%, 100% { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%); }
      50% { background: rgba(255, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <h1 class="game-title">CHROMA SHIELD</h1>
      <p class="game-subtitle">Tap to toggle shield color. Match incoming projectiles!</p>
      <button class="start-btn" onclick="startGame()">START GAME</button>
      <div class="attribution">
        "Life of Riley" Kevin MacLeod (incompetech.com)<br>
        Licensed under Creative Commons: By Attribution 4.0 License<br>
        <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank">http://creativecommons.org/licenses/by/4.0/</a>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
      <div class="top-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="stats">
          <div class="hearts" id="hearts">
            <span class="heart">❤</span>
            <span class="heart">❤</span>
            <span class="heart">❤</span>
          </div>
          <div class="score" id="score">0</div>
        </div>
      </div>

      <div class="game-area" id="gameArea" onclick="toggleShield()">
        <div class="shield shield-cyan" id="shield"></div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="game-over-screen">
      <h1 class="game-over-title">GAME OVER</h1>
      <p class="final-score">Final Score: <span id="finalScore">0</span></p>
      <button class="play-again-btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // Game State
    let lives = 3;
    let score = 0;
    let shieldColor = 'cyan'; // 'cyan' or 'magenta'
    let projectiles = [];
    let gameLoop = null;
    let spawnInterval = null;
    let isGameRunning = false;

    // Audio Context
    let audioContext = null;

    // Background Music
    let bgMusic = null;
    let musicEnabled = false;

    function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playToggleSound() {
      if (!audioContext) initAudio();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 600;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.1;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function playSuccessSound() {
      if (!audioContext) initAudio();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 880;
      oscillator.type = 'sine';
      gainNode.gain.value = 0.2;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
      oscillator.stop(audioContext.currentTime + 0.2);
    }

    function playErrorSound() {
      if (!audioContext) initAudio();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 150;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function playGameOverSound() {
      if (!audioContext) initAudio();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 100;
      oscillator.type = 'sawtooth';
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
      oscillator.stop(audioContext.currentTime + 0.5);
    }

    function playBackgroundMusic() {
      if (musicEnabled) return;
      bgMusic = new Audio('bgm.mp3');
      bgMusic.loop = true;
      bgMusic.volume = 0.3;
      bgMusic.play().catch(e => console.log('Audio play failed:', e));
      musicEnabled = true;
    }

    function stopBackgroundMusic() {
      if (bgMusic) {
        bgMusic.pause();
        bgMusic.currentTime = 0;
        musicEnabled = false;
      }
    }

    function toggleShield() {
      if (!isGameRunning) return;
      
      playToggleSound();
      shieldColor = shieldColor === 'cyan' ? 'magenta' : 'cyan';
      
      const shield = document.getElementById('shield');
      shield.className = 'shield ' + (shieldColor === 'cyan' ? 'shield-cyan' : 'shield-magenta');
    }

    function getDifficultyMultiplier() {
      // Increase difficulty as score increases
      // Base speed: 2, max speed: 5
      // Base spawn rate: 1500ms, min spawn rate: 500ms
      const difficultyLevel = Math.floor(score / 50);
      return Math.min(difficultyLevel, 10);
    }

    function getProjectileSpeed() {
      const baseSpeed = 2;
      const multiplier = getDifficultyMultiplier();
      return baseSpeed + (multiplier * 0.3);
    }

    function getSpawnRate() {
      const baseRate = 1500;
      const multiplier = getDifficultyMultiplier();
      return Math.max(500, baseRate - (multiplier * 100));
    }

    function spawnProjectile() {
      if (!isGameRunning) return;
      
      const gameArea = document.getElementById('gameArea');
      const rect = gameArea.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      // Random spawn edge (0: top, 1: right, 2: bottom, 3: left)
      const edge = Math.floor(Math.random() * 4);
      let startX, startY;
      let velocityX, velocityY;
      const speed = getProjectileSpeed();
      
      switch(edge) {
        case 0: // Top
          startX = Math.random() * rect.width;
          startY = -30;
          velocityX = (centerX - startX) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          velocityY = (centerY - startY) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          break;
        case 1: // Right
          startX = rect.width + 30;
          startY = Math.random() * rect.height;
          velocityX = (centerX - startX) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          velocityY = (centerY - startY) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          break;
        case 2: // Bottom
          startX = Math.random() * rect.width;
          startY = rect.height + 30;
          velocityX = (centerX - startX) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          velocityY = (centerY - startY) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          break;
        case 3: // Left
          startX = -30;
          startY = Math.random() * rect.height;
          velocityX = (centerX - startX) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          velocityY = (centerY - startY) / Math.sqrt(Math.pow(centerX - startX, 2) + Math.pow(centerY - startY, 2)) * speed;
          break;
      }
      
      const color = Math.random() < 0.5 ? 'cyan' : 'magenta';
      
      const projectile = {
        x: startX,
        y: startY,
        velocityX: velocityX,
        velocityY: velocityY,
        color: color,
        element: null
      };
      
      // Create DOM element
      const element = document.createElement('div');
      element.className = 'projectile projectile-' + color;
      element.style.left = startX + 'px';
      element.style.top = startY + 'px';
      gameArea.appendChild(element);
      projectile.element = element;
      
      projectiles.push(projectile);
    }

    function updateProjectiles() {
      if (!isGameRunning) return;
      
      const gameArea = document.getElementById('gameArea');
      const rect = gameArea.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const shieldRadius = 60; // 120px / 2
      
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const proj = projectiles[i];
        
        // Update position
        proj.x += proj.velocityX;
        proj.y += proj.velocityY;
        
        // Update DOM element
        proj.element.style.left = proj.x + 'px';
        proj.element.style.top = proj.y + 'px';
        
        // Check collision with shield
        const distance = Math.sqrt(Math.pow(proj.x - centerX, 2) + Math.pow(proj.y - centerY, 2));
        
        if (distance <= shieldRadius) {
          // Collision detected
          if (proj.color === shieldColor) {
            // Match - success
            playSuccessSound();
            score += 10;
            document.getElementById('score').textContent = score;
            
            // Pulse shield
            const shield = document.getElementById('shield');
            shield.classList.add('pulse');
            setTimeout(() => shield.classList.remove('pulse'), 300);
          } else {
            // No match - error
            playErrorSound();
            loseLife();
            
            // Flash screen red
            document.body.classList.add('error-flash');
            setTimeout(() => document.body.classList.remove('error-flash'), 300);
          }
          
          // Remove projectile
          proj.element.remove();
          projectiles.splice(i, 1);
        }
        
        // Remove if out of bounds (shouldn't happen with current logic, but safety check)
        if (proj.x < -50 || proj.x > rect.width + 50 || proj.y < -50 || proj.y > rect.height + 50) {
          proj.element.remove();
          projectiles.splice(i, 1);
        }
      }
    }

    function loseLife() {
      lives--;
      updateHearts();
      
      if (lives <= 0) {
        gameOver();
      }
    }

    function updateHearts() {
      const heartsContainer = document.getElementById('hearts');
      const hearts = heartsContainer.querySelectorAll('.heart');
      
      hearts.forEach((heart, index) => {
        if (index >= lives) {
          heart.classList.add('lost');
        } else {
          heart.classList.remove('lost');
        }
      });
    }

    function gameOver() {
      isGameRunning = false;
      clearInterval(gameLoop);
      clearInterval(spawnInterval);
      stopBackgroundMusic();
      playGameOverSound();
      
      // Clear all projectiles
      projectiles.forEach(proj => proj.element.remove());
      projectiles = [];
      
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').textContent = score;
    }

    function startGame() {
      // Reset state
      lives = 3;
      score = 0;
      shieldColor = 'cyan';
      projectiles = [];
      isGameRunning = true;
      
      // Update UI
      document.getElementById('score').textContent = score;
      updateHearts();
      
      // Reset shield
      const shield = document.getElementById('shield');
      shield.className = 'shield shield-cyan';
      
      // Show game screen
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('gameScreen').classList.remove('hidden');
      
      // Start music
      playBackgroundMusic();
      
      // Start game loop
      gameLoop = setInterval(updateProjectiles, 16); // ~60 FPS
      
      // Start spawning projectiles
      spawnInterval = setInterval(spawnProjectile, getSpawnRate());
      
      // Update spawn rate dynamically
      setInterval(() => {
        if (isGameRunning) {
          clearInterval(spawnInterval);
          spawnInterval = setInterval(spawnProjectile, getSpawnRate());
        }
      }, 5000);
    }

    function goBack() {
      isGameRunning = false;
      clearInterval(gameLoop);
      clearInterval(spawnInterval);
      stopBackgroundMusic();
      
      // Clear all projectiles
      projectiles.forEach(proj => proj.element.remove());
      projectiles = [];
      
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-initialize audio context on first user interaction
      document.body.addEventListener('click', () => {
        if (!audioContext) initAudio();
      }, { once: true });
    });
  </script>
</body>
</html>
